name: Keep Supabase awake
on:
  # Free-tier Supabase projects pause after 7 days without activity. One small read a day through
  # the public posts view counts as activity. It runs separately from the deploy so a failed build
  # (an audit finding, say) can't stop it.
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one row from the public posts view
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase secrets are not set; nothing to keep awake."
            exit 0
          fi
          AUTH=()
          case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
          # Fails the run (and sends the usual failure email) if the project is paused or unreachable.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $KEY" "${AUTH[@]}" "${URL%/}/rest/v1/public_posts?select=id&limit=1")
          echo "Supabase responded with HTTP $code"
          [ "$code" = 200 ]
